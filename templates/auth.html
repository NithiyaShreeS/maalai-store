{% extends "base.html" %}
{% block body %}
<div class="wrap page narrow"><h1>{{ 'Create account' if mode=='register' else 'Log in' }}</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% if mode=='register' %}<label>Name<input name="name" required></label>{% endif %}
  <label>Email<input name="email" type="email" required></label>
  <label>Password<input class="field" name="password" type="password" minlength="8" required></label>
  <button class="btn">{{ 'Create account' if mode=='register' else 'Log in' }}</button>
</form>
{% if mode=='login' %}<p>New here? <a href="{{ url_for('register', next=request.args.next) }}">Create an account</a></p>
{% else %}<p>Have an account? <a href="{{ url_for('login', next=request.args.next) }}">Log in</a></p>{% endif %}</div>
{% endblock %}
